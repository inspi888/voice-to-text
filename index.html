<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Голос в текст</title>
<style>
  :root{
    --bg:#f6f4ef;
    --paper:#ffffff;
    --ink:#2b2a28;
    --ink-soft:#6f6b63;
    --accent:#c9704a;
    --accent-dark:#a8583a;
    --line:#e6e1d6;
    --danger:#b3492f;
    --record:#d1543a;
    --warn-bg:#fdf8ec;
    --warn-line:#e4d6b4;
    --warn-ink:#6b5a2e;
    --radius:16px;
    --shadow:0 2px 10px rgba(43,42,40,0.06), 0 10px 30px rgba(43,42,40,0.05);
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,112,74,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(201,112,74,0.04), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }
  header{
    text-align:center;
    margin-bottom:20px;
  }
  header h1{
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:.9rem;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .card{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    border:1px solid var(--line);
  }
  #status-line{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.82rem;
    color:var(--ink-soft);
    margin-bottom:10px;
    min-height:18px;
  }
  .rec-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--record);
    display:none;
  }
  .rec-dot.active{
    display:inline-block;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
  }
  #transcript{
    width:100%;
    min-height:260px;
    resize:vertical;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Georgia','Iowan Old Style',serif;
    font-size:1.08rem;
    line-height:1.6;
    color:var(--ink);
    padding:4px 2px;
  }
  #transcript::placeholder{color:#b8b3a8}
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.78rem;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    margin-top:10px;
    padding-top:8px;
  }
  .controls{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  button{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.92rem;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  #record-btn{
    grid-column:1 / -1;
    background:var(--accent);
    color:#fff;
    padding:16px;
    font-size:1rem;
    box-shadow:0 6px 16px rgba(201,112,74,0.35);
  }
  #record-btn:hover{background:var(--accent-dark)}
  #record-btn.recording{
    background:var(--record);
    box-shadow:0 6px 16px rgba(209,84,58,0.35);
  }
  #copy-btn{
    background:var(--ink);
    color:#fff;
    grid-column:1 / -1;
  }
  #download-btn,
  #clear-btn{
    background:var(--paper);
    border:1px solid var(--line);
  }
  #download-btn{color:var(--ink)}
  #clear-btn{color:var(--danger)}
  #download-btn:hover{background:#faf8f3}
  #clear-btn:hover{background:#fbf2ee}
  #toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .banner{
    display:none;
    border-radius:12px;
    padding:12px 14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:.84rem;
    line-height:1.55;
    margin-bottom:14px;
  }
  .banner.show{display:block}
  #error-banner{
    background:#fbf2ee;
    border:1px solid #e8c9bd;
    color:var(--danger);
  }
  #context-banner{
    background:var(--warn-bg);
    border:1px solid var(--warn-line);
    color:var(--warn-ink);
  }
  #unsupported-screen{
    display:none;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:28px 22px;
    text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #unsupported-screen h2{
    font-family:'Georgia',serif;
    margin-top:0;
  }
  #unsupported-screen p{
    color:var(--ink-soft);
    font-size:.92rem;
    line-height:1.6;
  }
  @media (max-width:420px){
    header h1{font-size:1.3rem}
    #transcript{font-size:1rem;min-height:220px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Голос в текст</h1>
    <p>Надиктуйте мысль — отредактируйте — скопируйте</p>
  </header>

  <div id="unsupported-screen">
    <h2>Диктовка недоступна в этом браузере</h2>
    <p id="unsupported-text"></p>
  </div>

  <div id="main-ui">
    <div id="context-banner" class="banner"></div>
    <div id="error-banner" class="banner"></div>

    <div class="card">
      <div id="status-line">
        <span class="rec-dot" id="rec-dot"></span>
        <span id="status-text">Готово к записи</span>
      </div>

      <textarea id="transcript" placeholder="Нажмите «Начать запись» и говорите — текст появится здесь..."></textarea>

      <div class="meta-row">
        <span id="char-count">0 символов</span>
        <span id="word-count">0 слов</span>
      </div>
    </div>

    <div class="controls">
      <button id="record-btn">
        <span id="record-btn-icon">●</span>
        <span id="record-btn-label">Начать запись</span>
      </button>
      <button id="copy-btn">Копировать текст</button>
      <button id="download-btn">Скачать TXT</button>
      <button id="clear-btn">Очистить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const mainUI = document.getElementById('main-ui');
const unsupportedBox = document.getElementById('unsupported-screen');
const unsupportedText = document.getElementById('unsupported-text');
const recordBtn = document.getElementById('record-btn');
const recordBtnLabel = document.getElementById('record-btn-label');
const recordBtnIcon = document.getElementById('record-btn-icon');
const copyBtn = document.getElementById('copy-btn');
const downloadBtn = document.getElementById('download-btn');
const clearBtn = document.getElementById('clear-btn');
const transcriptEl = document.getElementById('transcript');
const statusText = document.getElementById('status-text');
const recDot = document.getElementById('rec-dot');
const charCountEl = document.getElementById('char-count');
const wordCountEl = document.getElementById('word-count');
const errorBanner = document.getElementById('error-banner');
const contextBanner = document.getElementById('context-banner');
const toast = document.getElementById('toast');

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isFileProtocol = location.protocol === 'file:';
const isSecure = window.isSecureContext;

let micPermission = 'unknown';
let recognition = null;
let isRecording = false;
let shouldAutoRestart = false;
let restartAttempts = 0;
let finalizedTranscript = '';
let currentInterim = '';
let lastRenderedText = '';
let saveTimeout = null;
let toastTimeout = null;

if (!SpeechRecognitionAPI) {
  mainUI.style.display = 'none';
  unsupportedBox.style.display = 'block';
  unsupportedText.textContent = isIOS
    ? 'На устройствах iOS (iPhone/iPad) браузеры не поддерживают Web Speech API. Откройте страницу на компьютере или Android-устройстве в Chrome.'
    : 'Похоже, ваш браузер не поддерживает распознавание речи через Web Speech API. Попробуйте Chrome или Edge.';
}

if (!isSecure) {
  contextBanner.classList.add('show');
  contextBanner.innerHTML = isFileProtocol
    ? 'Страница открыта как файл (<b>file://</b>). В этом режиме браузер не запоминает разрешение на микрофон. Лучше открыть страницу по <b>https://</b> или на <b>localhost</b>.'
    : 'Соединение не защищено. Чтобы браузер запомнил доступ к микрофону, откройте страницу по <b>https://</b>.';
}

if (SpeechRecognitionAPI) {
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = handleResult;
  recognition.onend = handleEnd;
  recognition.onerror = handleError;
}

function normalizeSpacing(text) {
  return text.replace(/\s+/g, ' ').trim();
}

function renderTranscript() {
  const combined = [finalizedTranscript, currentInterim].filter(Boolean).join(' ').trim();
  lastRenderedText = combined;
  transcriptEl.value = combined ? combined + ' ' : '';
  updateCounters();
  saveToLocalStorage();
}

function handleResult(event) {
  restartAttempts = 0;
  let interim = '';
  let finalChunk = '';

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const result = event.results[i];
    const text = normalizeSpacing(result[0].transcript);
    if (!text) continue;

    if (result.isFinal) {
      finalChunk += (finalChunk ? ' ' : '') + text;
    } else {
      interim += (interim ? ' ' : '') + text;
    }
  }

  if (finalChunk) {
    finalizedTranscript = [finalizedTranscript, normalizeSpacing(finalChunk)].filter(Boolean).join(' ').trim();
  }

  currentInterim = normalizeSpacing(interim);
  renderTranscript();

  statusText.textContent = currentInterim
    ? 'Распознаётся: ' + currentInterim
    : 'Идёт запись — говорите';
}

function handleEnd() {
  currentInterim = '';
  renderTranscript();

  if (!shouldAutoRestart) {
    stopRecordingUI();
    return;
  }

  if (restartAttempts >= 5) {
    shouldAutoRestart = false;
    stopRecordingUI();
    showError('Запись несколько раз подряд прерывалась. Текст сохранён — нажмите «Начать запись» ещё раз.');
    return;
  }

  restartAttempts++;
  setTimeout(() => {
    if (!shouldAutoRestart) return;
    try {
      recognition.start();
      statusText.textContent = 'Идёт запись — говорите';
    } catch (e) {
      if (e && e.name === 'InvalidStateError') return;
      shouldAutoRestart = false;
      stopRecordingUI();
      showError('Запись прервалась и не смогла возобновиться автоматически.');
    }
  }, 350);
}

function handleError(event) {
  const err = event.error;

  if (err === 'not-allowed' || err === 'service-not-allowed') {
    shouldAutoRestart = false;
    micPermission = 'denied';
    stopRecordingUI();
    showError('Доступ к микрофону запрещён для этой страницы. Разрешите микрофон через значок замка слева от адреса и обновите страницу.');
  } else if (err === 'no-speech') {
    return;
  } else if (err === 'audio-capture') {
    shouldAutoRestart = false;
    stopRecordingUI();
    showError('Не удалось получить доступ к микрофону. Проверьте, что он подключён и не занят другим приложением.');
  } else if (err === 'network') {
    showError('Проблема с сетью при распознавании речи. Уже надиктованный текст сохранён.');
  } else {
    showError('Произошла ошибка распознавания речи (' + err + ').');
  }
}

async function refreshPermissionState() {
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const status = await navigator.permissions.query({ name: 'microphone' });
      micPermission = status.state;
      status.onchange = () => { micPermission = status.state; };
    }
  } catch (e) {
    micPermission = 'unknown';
  }
}

async function ensureMicPermission() {
  if (micPermission === 'granted') return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;

  try {
    statusText.textContent = 'Запрашиваю доступ к микрофону…';
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(track => track.stop());
    micPermission = 'granted';
    hideError();
    return true;
  } catch (e) {
    micPermission = 'denied';
    stopRecordingUI();
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      showError('Браузер не дал доступ к микрофону. Нажмите на значок замка слева от адреса → «Микрофон» → «Разрешить», затем обновите страницу.');
    } else if (e && e.name === 'NotFoundError') {
      showError('Микрофон не найден. Проверьте, что устройство подключено и выбрано в системе.');
    } else {
      showError('Не удалось получить доступ к микрофону (' + (e && e.name ? e.name : 'ошибка') + ').');
    }
    return false;
  }
}

async function startRecording() {
  if (!recognition) return;

  recordBtn.disabled = true;
  const allowed = await ensureMicPermission();
  recordBtn.disabled = false;
  if (!allowed) return;

  finalizedTranscript = normalizeSpacing(transcriptEl.value);
  currentInterim = '';
  restartAttempts = 0;

  try {
    shouldAutoRestart = true;
    recognition.start();
    isRecording = true;
    recordBtn.classList.add('recording');
    recordBtnLabel.textContent = 'Остановить';
    recordBtnIcon.textContent = '■';
    recDot.classList.add('active');
    statusText.textContent = 'Идёт запись — говорите';
    hideError();
  } catch (e) {
    if (e && e.name === 'InvalidStateError') {
      isRecording = true;
      return;
    }
    showError('Не удалось запустить запись. Обновите страницу и попробуйте снова.');
  }
}

function stopRecording() {
  if (!recognition) return;
  shouldAutoRestart = false;
  try {
    recognition.stop();
  } catch (e) {}
}

function stopRecordingUI() {
  isRecording = false;
  currentInterim = '';
  renderTranscript();
  recordBtn.classList.remove('recording');
  recordBtnLabel.textContent = 'Начать запись';
  recordBtnIcon.textContent = '●';
  recDot.classList.remove('active');
  if (!errorBanner.classList.contains('show')) {
    statusText.textContent = 'Готово к записи';
  }
}

recordBtn.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

function formatCount(n, forms) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  let word;
  if (mod10 === 1 && mod100 !== 11) word = forms[0];
  else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) word = forms[1];
  else word = forms[2];
  return n + ' ' + word;
}

function updateCounters() {
  const text = transcriptEl.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  charCountEl.textContent = formatCount(chars, ['символ', 'символа', 'символов']);
  wordCountEl.textContent = formatCount(words, ['слово', 'слова', 'слов']);
}

function saveToLocalStorage() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    try {
      localStorage.setItem('voice-to-text-draft', transcriptEl.value.trim());
    } catch (e) {}
  }, 500);
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem('voice-to-text-draft');
    if (saved) {
      transcriptEl.value = saved;
      finalizedTranscript = normalizeSpacing(saved);
      updateCounters();
    }
  } catch (e) {}
}

transcriptEl.addEventListener('input', () => {
  if (!isRecording) {
    finalizedTranscript = normalizeSpacing(transcriptEl.value);
  }
  updateCounters();
  saveToLocalStorage();
});

copyBtn.addEventListener('click', async () => {
  const text = transcriptEl.value.trim();
  if (!text) {
    showToast('Нечего копировать — текст пуст');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Текст скопирован');
  } catch (e) {
    transcriptEl.select();
    document.execCommand('copy');
    showToast('Текст скопирован');
  }
});

downloadBtn.addEventListener('click', () => {
  const text = transcriptEl.value.trim();
  if (!text) {
    showToast('Нечего сохранять — текст пуст');
    return;
  }
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const filename = `voice-note-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.txt`;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Файл сохранён: ' + filename);
});

clearBtn.addEventListener('click', () => {
  if (!transcriptEl.value.trim()) return;
  const confirmed = confirm('Очистить весь текст? Это действие нельзя отменить.');
  if (confirmed) {
    transcriptEl.value = '';
    finalizedTranscript = '';
    currentInterim = '';
    updateCounters();
    saveToLocalStorage();
    showToast('Текст очищен');
  }
});

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
}

function showError(message) {
  errorBanner.textContent = message;
  errorBanner.classList.add('show');
}

function hideError() {
  errorBanner.classList.remove('show');
  errorBanner.textContent = '';
}

window.addEventListener('DOMContentLoaded', () => {
  loadFromLocalStorage();
  updateCounters();
  refreshPermissionState();
});
</script>
</body>
</html>
